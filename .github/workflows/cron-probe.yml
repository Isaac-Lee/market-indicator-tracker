name: cron-probe

# daily-collect 의 예정 실행이 며칠째 발화하지 않는데, 관측만으로는 GitHub 이
# 이 저장소의 cron 을 등록조차 안 한 건지 아니면 등록해두고 트리거를 흘리는
# 건지 가를 수 없다. 이 워크플로는 그것만 묻는다 — 데이터도, 비밀값도,
# 커밋도 건드리지 않고 발화 여부만 기록한다.
#
# 답이 나오면 이 파일은 지운다.
# 10 분 간격인 건 급해서가 아니라 표본이 필요해서다. 하루 한 슬롯으로는
# "안 돌았다" 가 유실인지 미등록인지 구분하는 데 며칠이 걸린다. 10 분마다
# 두면 한 시간에 6 개, 반나절이면 시간대별 발화율이 나온다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "발화 시각: $(date -u '+%F %H:%M:%S UTC')"
          echo "계기: ${{ github.event_name }}"
