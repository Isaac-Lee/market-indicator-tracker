name: daily-collect

on:
  schedule:
    - cron: "10 7 * * 1-5"   # 07:10 UTC = 16:10 KST, 평일
  # push 는 빌드가 깨지지 않았는지 보는 것이라, 실행에 영향을 주지 않는 것만
  # 바뀌었으면 돌릴 이유가 없다.
  push:
    paths-ignore:
      - "**.md"
      - "docs/screenshots/**"
      - "docs/logo.png"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      skip_kis:
        description: "KIS 수집 건너뛰기 (토큰 발급 알림톡 안 받기)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 수집 + 텔레그램 알림
        run: python notify_daily.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 예약 실행(schedule)은 항상 전체 수집. push(빌드 테스트)는 KIS 알림톡을
          # 막기 위해 무조건 건너뛴다. workflow_dispatch는 입력값을 따른다.
          SKIP_KIS: ${{ (github.event_name != 'schedule' && (github.event_name == 'push' || inputs.skip_kis)) && '1' || '0' }}
          # push는 빌드 테스트일 뿐이라 텔레그램 등 외부 상태를 건드리지 않는다.
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}

      # collect.py 는 계열을 받는 족족 data/*.csv 에 쓴다. 뒤 단계가 실패해도 이미
      # 받아둔 데이터는 커밋해야 한다 — 안 그러면 그 날 수집분이 통째로 버려지고,
      # 다음 날 --daily 는 최근 며칠만 보므로 구멍이 남는다.
      - name: 대시보드 데이터 생성
        if: always()
        run: python build_dashboard.py

      - name: 결과 커밋
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "자동: 일일 지표 갱신 $(date -u +%F)"
          # 사이에 사람이 push 했으면 non-fast-forward 로 막힌다. 우리 커밋은 데이터
          # 파일뿐이라 그 위로 rebase 해서 다시 올린다.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push 실패 ($attempt) — rebase 후 재시도"
            git pull --rebase --autostash origin main
          done
          git push
